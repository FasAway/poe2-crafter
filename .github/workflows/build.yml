name: Build EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run offline tests
        run: python -m unittest discover -v

      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm build.spec

      - name: Smoke-test packaged application
        run: |
          $taskSmokeReport = Join-Path $env:RUNNER_TEMP 'poe2-smoke.json'
          $taskFixture = (Resolve-Path 'sample_item.txt').Path
          $taskArguments = '--self-test "' + $taskFixture + '" "' + $taskSmokeReport + '"'
          $taskProcess = Start-Process -FilePath 'dist/PoE2Crafter.exe' -ArgumentList $taskArguments -WindowStyle Hidden -Wait -PassThru
          if ($taskProcess.ExitCode -ne 0) { throw 'Packaged application failed to start' }
          if (-not (Test-Path -LiteralPath $taskSmokeReport)) { throw 'Smoke report missing' }
          $taskReport = Get-Content -LiteralPath $taskSmokeReport -Raw | ConvertFrom-Json
          if ($taskReport.evaluation -ne 'matched' -or $taskReport.rows -ne 7 -or $taskReport.conditions -ne 1 -or $taskReport.window_bound) {
            throw 'Unexpected smoke-test result'
          }

      - name: Archive source
        run: git archive --format=zip --output=dist/PoE2Crafter-source.zip HEAD

      - name: Upload executable and source
        uses: actions/upload-artifact@v7
        with:
          name: poe2-crafter-windows
          path: |
            dist/PoE2Crafter.exe
            dist/PoE2Crafter-source.zip
          if-no-files-found: error
          retention-days: 30
